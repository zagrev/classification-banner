name: Build

on:
  push:
    branches-ignore: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_PROJECT: ClassificationBannerApp.csproj
  TEST_PROJECT: tests/ClassificationBannerApp.Tests.csproj
  CONFIGURATION: Release
  RUNTIME_IDENTIFIER: win-x64
  MINIMUM_LINE_COVERAGE: '85'

jobs:
  build:
    # WPF and Windows Forms target net9.0-windows, which cannot be built on Linux runners.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # The app targets net9.0-windows; the 10.x SDK is installed alongside to match
          # local development machines.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore ${{ env.APP_PROJECT }}
          dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.TEST_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Verify coverage threshold
        shell: pwsh
        run: >
          ./build/Check-Coverage.ps1
          -ResultsDirectory TestResults
          -MinimumLineRate ${{ env.MINIMUM_LINE_COVERAGE }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml

      - name: Publish self-contained
        # Mirrors the Release workflow so packaging problems surface on pull requests
        # rather than at release time.
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ env.RUNTIME_IDENTIFIER }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/self-contained

      - name: Publish framework-dependent
        run: >
          dotnet publish ${{ env.APP_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ env.RUNTIME_IDENTIFIER }}
          --self-contained false
          -p:PublishSingleFile=true
          --output publish/framework-dependent

      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassificationBannerApp-${{ env.RUNTIME_IDENTIFIER }}-self-contained
          path: publish/self-contained

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassificationBannerApp-${{ env.RUNTIME_IDENTIFIER }}-framework-dependent
          path: publish/framework-dependent
